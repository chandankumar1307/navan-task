# Stage Profile - Docker PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/navan_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=navan_user
spring.datasource.password=navan_password

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=NavanPostgresHikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
