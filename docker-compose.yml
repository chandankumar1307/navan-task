services:
  postgres:
    image: postgres:16-alpine
    container_name: navan-travel-postgres
    environment:
      POSTGRES_DB: navan_db
      POSTGRES_USER: navan_user
      POSTGRES_PASSWORD: navan_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navan_user -d navan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
